[project]
name = "entirius-django-captcha"
version = "2.0.0"
description = "reCAPTCHA verification for Entirius: a view decorator backed by per-channel service configuration"
keywords = ["django", "recaptcha", "captcha", "security", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=4.0.0",
    "requests>=2.28.0",
    "entirius-django-utils>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://docs.entirius.com/"
Repository = "https://github.com/entirius/entirius-django-captcha"
Changelog = "https://github.com/entirius/entirius-django-captcha/releases"
Issues = "https://github.com/entirius/entirius-django-captcha/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_captcha"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
# Legacy migrated 1:1
"src/django_captcha/models/service.py" = ["DJ001"]
"src/django_captcha/output/decorators.py" = ["S113"]

[tool.ruff.lint.isort]
known-first-party = ["django_captcha"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
